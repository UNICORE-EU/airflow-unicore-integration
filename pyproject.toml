[build-system]
requires = [
  "setuptools>=77",
  "wheel"
  ]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-unicore-integration"
version = "0.7.0"
authors = [
  { name="Christian Böttcher", email="c.boettcher@fz-juelich.de" },
]
description = "Running Unicore Jobs from airflow DAGs."
readme = "README.rst"
requires-python = ">=3.10"
license = "BSD-3-Clause"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]



dependencies = [
    "pyunicore>=1.0.0",
    "apache-airflow>=3.4.0",
    "requests[socks]",
    "httpx[socks]",
    "apache-airflow-providers-git>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.6",
]

[project.urls]
Homepage = "https://github.com/UNICORE-EU/airflow-unicore-integration"
Issues = "https://github.com/UNICORE-EU/airflow-unicore-integration/issues"

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow_unicore_integration:get_provider_info"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
ignore = [
  "E501",  # line length is black's job
  "E203",  # whitespace around slicing, conflicts with black
]

[tool.ruff.lint.isort]
force-single-line = true  # matches the one-import-per-line style used throughout
